<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antikor — Skin Preview</title>
  <style>
    :root {
      --bg: #05070e;
      --panel: #0d1320;
      --panel-2: #121b2a;
      --cyan: #5de6ff;
      --pink: #ff5ec4;
      --gold: #ffd23e;
      --text: #eaf7ff;
      --muted: #9bb7d1;
      --grid: rgba(255,255,255,.08);
      --shadow: rgba(93,230,255,.3);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #0d1420 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      padding: 24px;
    }

    .wrap {
      max-width: 1300px;
      margin: 0 auto;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 12px rgba(93,230,255,.5);
    }

    .badge {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, rgba(17,25,36,.92), rgba(8,12,18,.96));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 0 0 1px rgba(93,230,255,.08), 0 10px 18px rgba(0,0,0,.28);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(93,230,255,.08), transparent 55%);
      pointer-events: none;
    }

    .card canvas {
      display: block;
      margin: 0 auto 12px;
      width: 128px;
      height: 128px;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.04), rgba(0,0,0,.18));
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.06);
    }

    .name {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .05em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <h1>Antikor skins</h1>
      <div class="badge">Preview canvas</div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const TAU = Math.PI * 2;

    function hexA(hex, a) {
      const clean = hex.replace('#', '');
      const safe = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean;
      const n = parseInt(safe, 16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    const SKINS = {
      base: { name: 'Standard', src: 'base', col: null, col2: '#ffffff' },
      toxic: { name: 'Toxique', src: 'shop', price: 120, col: '#8dff5a', col2: '#e8ffd0' },
      magma: { name: 'Magma', src: 'shop', price: 150, col: '#ff6a2a', col2: '#ffd23e', deco: 'flame' },
      ice: { name: 'Glace', src: 'shop', price: 150, col: '#8fe8ff', col2: '#ffffff', deco: 'frost' },
      gold: { name: 'Or', src: 'shop', price: 250, col: '#ffd23e', col2: '#fff3b0', deco: 'shine' },
      void: { name: 'Néon noir', src: 'shop', price: 220, col: '#b46bff', col2: '#ff3d8b', fill: '#05020a' },
      prism: { name: 'Prisme', src: 'shop', price: 350, col: 'prism', col2: '#ffffff' },
      pumpkin: { name: 'Citrouille', src: 'halloween', col: '#ff8c1a', col2: '#ffd23e', deco: 'pumpkin', odds: 35 },
      ghost: { name: 'Fantôme', src: 'halloween', col: '#e8f4ff', col2: '#8fe8ff', deco: 'ghost', odds: 30 },
      bat: { name: 'Chauve-souris', src: 'halloween', col: '#9d4dff', col2: '#ff3d5a', deco: 'bat', odds: 25 },
      skull: { name: 'Squelette', src: 'halloween', col: '#f2f2e6', col2: '#ff3d5a', deco: 'skull', odds: 10 },
      loyal: { name: 'Fidèle', src: 'daily', col: '#62ff9a', col2: '#ffd23e', deco: 'crown' },
      aurora: { name: 'Aurore', src: 'daily', col: '#ff6ad5', col2: '#3ef2ff', deco: 'halo' },
    };

    function hueHex(h) {
      const f = n => {
        const k = (n + h / 30) % 12;
        const c = 0.62 - 0.38 * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        return Math.round(c * 255).toString(16).padStart(2, '0');
      };
      return '#' + f(0) + f(8) + f(4);
    }

    function skinLook(skin, playerCol, t, i = 0) {
      const S = SKINS[skin] || SKINS.base;
      let col = S.col || playerCol;
      if (col === 'prism') col = hueHex((t * 90 + i * 180) % 360);
      return { col, col2: S.col2 || '#ffffff', fill: S.fill || '#0b1c2a', deco: S.deco };
    }

    function heroBody(g, look, t) {
      const { col, col2, fill, deco } = look;
      g.shadowColor = col;
      g.shadowBlur = 14;
      g.lineJoin = 'round';
      g.lineCap = 'round';

      if (deco === 'bat') {
        g.fillStyle = hexA(col, 0.35);
        g.strokeStyle = col;
        g.lineWidth = 1.6;
        for (const s of [-1, 1]) {
          g.beginPath();
          g.moveTo(-4, s * 9);
          g.quadraticCurveTo(-8, s * 26, -20, s * 24);
          g.lineTo(-14, s * 18);
          g.lineTo(-20, s * 14);
          g.lineTo(-12, s * 11);
          g.closePath();
          g.fill();
          g.stroke();
        }
      }

      if (deco === 'ghost') {
        g.fillStyle = hexA(col, 0.45);
        g.beginPath();
        g.moveTo(-6, -12);
        for (let k = 0; k <= 6; k++) g.lineTo(-24 - Math.sin(t * 8 + k) * 3, -12 + k * 4);
        g.lineTo(-6, 12);
        g.closePath();
        g.fill();
      }

      g.fillStyle = '#0b1828';
      g.strokeStyle = col;
      g.lineWidth = 2;
      g.beginPath();
      if (g.roundRect) g.roundRect(-17, -8, 8, 16, 3); else g.rect(-17, -8, 8, 16);
      g.fill();
      g.stroke();

      if (deco === 'flame') {
        g.fillStyle = hexA(col2, 0.7);
        for (const y of [-4, 4]) {
          const l = 7 + Math.sin(t * 20 + y) * 3;
          g.beginPath();
          g.moveTo(-17, y - 3);
          g.lineTo(-17 - l, y);
          g.lineTo(-17, y + 3);
          g.fill();
        }
      }

      g.fillStyle = '#163045';
      g.beginPath();
      g.rect(4, -3.5, 20, 7);
      g.fill();
      g.strokeStyle = '#e8fbff';
      g.lineWidth = 1.8;
      g.stroke();

      g.fillStyle = deco === 'pumpkin' ? hexA(col, 0.9) : fill;
      g.strokeStyle = col;
      g.lineWidth = 2.6;
      g.beginPath();
      g.arc(0, 0, 13, 0, TAU);
      g.fill();
      g.stroke();
      g.fillStyle = hexA(col, 0.18);
      g.fill();

      if (deco === 'pumpkin') {
        g.strokeStyle = hexA('#7a3a00', 0.8);
        g.lineWidth = 1.4;
        for (const y of [-6, 0, 6]) {
          g.beginPath();
          g.ellipse(0, y * 0.4, 12, 4 + Math.abs(y), 0, Math.PI * 0.6, Math.PI * 1.4);
          g.stroke();
        }
        g.strokeStyle = '#62ff9a';
        g.lineWidth = 3;
        g.beginPath();
        g.moveTo(-13, 0);
        g.lineTo(-17, -3);
        g.stroke();
      }

      g.strokeStyle = hexA(col, 0.7);
      g.lineWidth = 1.6;
      g.beginPath();
      g.arc(0, 0, 8, 1.9, 4.4);
      g.stroke();

      g.shadowColor = col2;
      if (deco === 'pumpkin' || deco === 'skull') {
        g.fillStyle = deco === 'pumpkin' ? '#2a1200' : '#05070e';
        for (const y of [-4.5, 4.5]) {
          g.beginPath();
          if (deco === 'pumpkin') {
            g.moveTo(8, y - 2.5);
            g.lineTo(3, y + 2.5);
            g.lineTo(8, y + 2.5);
          } else g.arc(5, y, 3.2, 0, TAU);
          g.fill();
        }
        g.fillStyle = col2;
        g.beginPath();
        g.arc(5, -4.5, 1.2, 0, TAU);
        g.arc(5, 4.5, 1.2, 0, TAU);
        g.fill();
      } else {
        g.strokeStyle = col2;
        g.lineWidth = 3.2;
        g.beginPath();
        g.arc(2, 0, 7, -0.9, 0.9);
        g.stroke();
      }

      if (deco === 'crown') {
        g.fillStyle = '#ffd23e';
        g.shadowColor = '#ffd23e';
        g.beginPath();
        g.moveTo(-8, -6);
        g.lineTo(-14, -9);
        g.lineTo(-12, -3);
        g.lineTo(-15, 0);
        g.lineTo(-12, 3);
        g.lineTo(-14, 9);
        g.lineTo(-8, 6);
        g.closePath();
        g.fill();
      } else if (deco === 'halo') {
        g.strokeStyle = col2;
        g.shadowColor = col2;
        g.lineWidth = 2;
        g.beginPath();
        g.ellipse(-3, 0, 5, 17, 0, 0, TAU);
        g.stroke();
      } else if (deco === 'frost') {
        g.strokeStyle = hexA('#ffffff', 0.8);
        g.lineWidth = 1.2;
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * TAU;
          g.beginPath();
          g.moveTo(Math.cos(a) * 15, Math.sin(a) * 15);
          g.lineTo(Math.cos(a) * 19, Math.sin(a) * 19);
          g.stroke();
        }
      } else if (deco === 'shine') {
        const a = (t * 2) % TAU;
        g.fillStyle = hexA('#ffffff', 0.85);
        g.beginPath();
        g.arc(Math.cos(a) * 9, Math.sin(a) * 9, 1.8, 0, TAU);
        g.fill();
      }

      g.shadowBlur = 0;
    }

    function drawSkinPreview(cv, skin, t = 0) {
      const g = cv.getContext('2d');
      const s = cv.width / 62;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, cv.width, cv.height);
      g.setTransform(s, 0, 0, s, cv.width / 2, cv.height / 2);
      heroBody(g, skinLook(skin, '#3ef2ff', t), t);
    }

    const grid = document.getElementById('grid');

    Object.entries(SKINS).forEach(([id, S]) => {
      const card = document.createElement('div');
      card.className = 'card';

      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;

      const name = document.createElement('p');
      name.className = 'name';
      name.textContent = S.name;

      const meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = `src: ${S.src || 'base'}${S.price ? ' · ' + S.price + ' noyaux' : ''}`;

      card.appendChild(canvas);
      card.appendChild(name);
      card.appendChild(meta);
      grid.appendChild(card);

      const t0 = performance.now() / 1000;
      const tick = () => {
        const t = (performance.now() / 1000 - t0) * 1.2;
        drawSkinPreview(canvas, id, t);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
